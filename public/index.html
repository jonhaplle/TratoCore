<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trato Core</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>TRATO CORE</h1>
        <p>Cadastro Inteligente de Produtos</p>

    </header>

    <main class="content">

        <!-- FOTO -->

        <section class="photo-panel">

            <div id="preview" class="preview">

                Sem imagem

            </div>

            <input
                type="file"
                id="photo"
                accept="image/*">

            <button id="btnAnalyze">

                Analisar com IA

            </button>

        </section>

        <!-- FORMULÁRIO -->

        <section class="form-panel">

            <div class="row">

                <div class="field">

                    <label>SKU</label>

                    <input
                        id="sku"
                        type="text">

                </div>

                <div class="field">

                    <label>Código de Barras</label>

                    <input
                        id="barcode"
                        type="text">

                </div>

            </div>

            <div class="field">

                <label>Título</label>

                <input
                    id="title"
                    type="text">

            </div>

            <div class="row">

                <div class="field">

                    <label>Marca</label>

                    <input
                        id="brand"
                        type="text">

                </div>

                <div class="field">

                    <label>Modelo</label>

                    <input
                        id="model"
                        type="text">

                </div>

            </div>

            <div class="field">

                <label>Categoria</label>

                <input
                    id="category"
                    type="text">

            </div>

            <div class="row">

                <div class="field">

                    <label>Preço</label>

                    <input
                        id="sale_price"
                        type="number"
                        step="0.01">

                </div>

                <div class="field">

                    <label>Quantidade</label>

                    <input
                        id="quantity"
                        type="number"
                        value="1">

                </div>

            </div>

            <div class="field">

                <label>Descrição</label>

                <textarea
                    id="description"
                    rows="8"></textarea>

            </div>

            <div class="buttons">

                <button id="btnSave">

                    Salvar Produto

                </button>

                <button id="btnNew">

                    Novo Produto

                </button>

            </div>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>

</html>
