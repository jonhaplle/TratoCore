name: TratoCore gallery checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/galeria-definitiva]

jobs:
  gallery-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run focused gallery and Drive tests
        run: npm test
